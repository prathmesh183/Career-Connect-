<!DOCTYPE html>

<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Career Connect</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>

        </ul>
      </div>
    </div>
  </nav>

  <!-- Application Form -->
  <div class="container mt-5">
    <h2 class="mb-4">Job Application Form</h2>
    <form class="card p-4 shadow" method="POST" action="submit.php" enctype="multipart/form-data">
      <div class="mb-3">
        <label>Full Name</label>
        <input type="text" class="form-control" name="full_name" placeholder="Enter your name" required>
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label>Job Position</label>
        <select class="form-control" name="job_id" required>
          <option value="1">Software Engineer</option>
          <option value="2">Data Analyst</option>
          <!-- Add more jobs here if needed -->
        </select>
      </div>
      <div class="mb-3">
        <label>Upload Resume</label>
        <input type="file" class="form-control" name="resume">
      </div>
      <button type="submit" class="btn btn-success w-100">Submit Application</button>
    </form>
  </div>
</body>
</html>
